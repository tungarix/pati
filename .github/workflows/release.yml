name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist

      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"

          # electron-builder writes "Pati Setup X.exe" but latest.yml points at "Pati-Setup-X.exe"
          mkdir upload
          cp "release/Pati Setup ${ver}.exe" "upload/Pati-Setup-${ver}.exe"
          cp "release/Pati Setup ${ver}.exe.blockmap" "upload/Pati-Setup-${ver}.exe.blockmap"
          cp release/latest.yml upload/latest.yml

          # notes: the CHANGELOG.md section named after the tag
          awk -v v="${ver}" '$1 == "##" && $2 == v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Pati ${ver}" > notes.md; fi

          gh release create "${tag}" upload/* --draft --title "${tag}" --notes-file notes.md
